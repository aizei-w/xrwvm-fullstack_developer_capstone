services:
  mongo_db:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
  api:
    build: .
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://mongo_db:27017/dealershipsDB
      PORT: 3030
    ports:
      - "3030:3030"
    depends_on:
      - mongo_db
volumes:
  mongo_data:
